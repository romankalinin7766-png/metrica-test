<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовый стенд Яндекс Метрики</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
        .card { border: 1px solid #ddd; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        button { background: #005bb5; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        button.esia { background: #0d4cd3; }
        input[type="text"], input[type="tel"] { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
        .log { background: #f4f4f4; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 12px; max-height: 180px; overflow-y: auto; }
    </style>

    <!-- ВСТАВЬТЕ СЮДА ВАШ КОД СЧЕТЧИКА ЯНДЕКС МЕТРИКИ (замените XXXXXX на ID) -->
    <script type="text/javascript">
       (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
       m[i].l=1*new Date();
       for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
       k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
       (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");

       ym(XXXXXX, "init", {
            clickmap:true,
            trackLinks:true,
            accurateTrackBounce:true,
            webvisor:true
       });
    </script>
    <!-- /КОД СЧЕТЧИКА -->
</head>
<body>

    <h2>Тестовая страница продукта</h2>

    <!-- Блок 1: Калькулятор -->
    <div class="card">
        <h3>1. Кредитный калькулятор</h3>
        <label>Сумма: <b id="amountVal">500000</b> ₽</label><br>
        <input type="range" id="amountRange" min="100000" max="3000000" step="50000" value="500000" style="width:100%"><br><br>
        <button id="calcApplyBtn">Оформить по расчету</button>
    </div>

    <!-- Блок 2: Госуслуги -->
    <div class="card">
        <h3>2. Авторизация через ЕСИА</h3>
        <button class="esia" id="esiaBtn">Заполнить через Госуслуги</button>
    </div>

    <!-- Блок 3: Форма заявки -->
    <div class="card">
        <h3>3. Анкета на карту / кредит</h3>
        <form id="creditForm">
            <label>ФИО</label>
            <input type="text" name="fio" placeholder="Иванов Иван Иванович">
            
            <label>Телефон</label>
            <input type="tel" name="phone" placeholder="+7 (999) 000-00-00">
            
            <label>СНИЛС</label>
            <input type="text" name="snils" placeholder="000-000-000 00">
            
            <button type="submit">Отправить заявку</button>
        </form>
    </div>

    <h4>Лог отправленных событий (для проверки):</h4>
    <div class="log" id="eventLog">Ожидание действий...</div>

    <script>
        const COUNTER_ID = XXXXXX; // <-- УКАЖИТЕ ВАШ ID СЧЕТЧИКА ЗДЕСЬ ТОЖЕ
        let formStartTime = null;
        let isEsiaUsed = false;
        const focusedFields = new Set();

        function sendGoal(goalName, params = {}) {
            if (typeof ym === 'function') {
                ym(COUNTER_ID, 'reachGoal', goalName, params);
            }
            const logBox = document.getElementById('eventLog');
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML = `[${time}] <b>${goalName}</b>: ${JSON.stringify(params)}<br>` + logBox.innerHTML;
            console.log('YM Goal:', goalName, params);
        }

        // 1. Калькулятор с debounce
        let calcTimer;
        const range = document.getElementById('amountRange');
        range.addEventListener('input', (e) => {
            document.getElementById('amountVal').textContent = e.target.value;
            clearTimeout(calcTimer);
            calcTimer = setTimeout(() => {
                sendGoal('credit_calc_use', { amount: Number(e.target.value), term_months: 36 });
            }, 1500);
        });

        document.getElementById('calcApplyBtn').addEventListener('click', () => {
            sendGoal('credit_calc_apply', { amount: Number(range.value), term_months: 36 });
        });

        // 2. Имитация Госуслуг
        document.getElementById('esiaBtn').addEventListener('click', () => {
            sendGoal('esia_auth_click');
            setTimeout(() => {
                isEsiaUsed = true;
                document.querySelector('[name="fio"]').value = 'Калинин Роман Владимирович';
                document.querySelector('[name="phone"]').value = '+7 (999) 123-45-67';
                sendGoal('esia_auth_success');
                sendGoal('esia_prefill_complete', { prefill_percent: 66 });
            }, 800);
        });

        // 3. Поля формы и замер времени
        document.querySelectorAll('#creditForm input').forEach(input => {
            input.addEventListener('focus', () => {
                if (!formStartTime) {
                    formStartTime = Date.now();
                    sendGoal('card_form_start', { card_name: 'Живые деньги' });
                }
                if (!focusedFields.has(input.name)) {
                    focusedFields.add(input.name);
                    sendGoal('credit_field_focus', { field_name: input.name });
                }
            });
        });

        // Отправка формы
        document.getElementById('creditForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const fillTime = formStartTime ? Math.round((Date.now() - formStartTime) / 1000) : 0;
            sendGoal('credit_form_submit', { is_esia: isEsiaUsed, fill_time_sec: fillTime });
            alert('Заявка отправлена! Проверьте консоль или лог ниже.');
        });
    </script>
</body>
</html>
